name: Saturnum CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install VIREON with its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './components/vireon[test]'
      - name: Compile project modules
        run: python -m compileall -q saturnum.py tests components/acoustic_bbox components/vireon/src components/vireon/tests components/acoustic_bbox/tests
      - name: Run Saturnum-level status/report tests
        run: python -m unittest discover -s tests -v
      - name: Verify machine-readable preflight report
        run: |
          python saturnum.py status --json > "$RUNNER_TEMP/saturnum-status.json"
          python -c "import json,sys; report=json.load(open(sys.argv[1], encoding='utf-8')); assert report['overall_status']=='pass', report" "$RUNNER_TEMP/saturnum-status.json"
      - name: Run combined component tests
        run: python saturnum.py check
      - name: Run Acoustic-B-Box self-test
        run: python saturnum.py acoustic --test
      - name: Smoke-test VIREON CLI through Saturnum
        run: |
          python saturnum.py vireon simulate --scenario biomarker-signal
          python saturnum.py vireon registry list

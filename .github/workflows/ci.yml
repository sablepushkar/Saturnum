name: Saturnum CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install VIREON and API test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./components/vireon "httpx>=0.27,<1"
      - name: Compile project modules
        run: python -m compileall -q saturnum.py components/acoustic_bbox components/vireon/src components/vireon/tests components/acoustic_bbox/tests
      - name: Run combined component tests
        run: python saturnum.py check
      - name: Run Acoustic-B-Box self-test
        run: python saturnum.py acoustic --test
      - name: Smoke-test VIREON CLI through Saturnum
        run: |
          python saturnum.py vireon simulate --scenario biomarker-signal
          python saturnum.py vireon registry list
